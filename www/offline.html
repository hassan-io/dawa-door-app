<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DawaDoor — no internet</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
      }
      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        border-radius: 18px;
        background: #059669;
        color: #fff;
        font-size: 40px;
        font-weight: 700;
        line-height: 64px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #475569; margin: 0 0 24px; }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 28px;
        background: #059669;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="logo">+</div>
      <h1>No internet connection</h1>
      <p>Check your mobile data or Wi-Fi, then try again.</p>
      <button type="button" onclick="location.href = 'https://dawadoor.vercel.app'">Try again</button>
    </div>
  </body>
</html>
